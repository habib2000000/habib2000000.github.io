<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة BM الذكية - الفحص الذكي</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        :root { --bg-dark: #0b1016; --pi-gold: #e5a93d; --primary-purple: #5e2a84; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-dark); color: white; margin: 0; text-align: center; }
        
        /* واجهة جوجل (الترحيبية) */
        #google-view { display: none; height: 100vh; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg, #0b1016, #1a1f26); }
        
        /* واجهة تطبيق باي الرسمية */
        #pi-app-view { display: none; padding: 20px; }
        
        .direct-btn { background: var(--pi-gold); color: black; padding: 20px 40px; border-radius: 50px; font-weight: bold; font-size: 1.2rem; border: none; cursor: pointer; animation: pulse 2s infinite; text-decoration: none; display: inline-block; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .card { background: #161b22; border-radius: 25px; padding: 30px; border: 1px solid var(--primary-purple); margin-top: 50px; }
    </style>
</head>
<body>

    <audio id="joy-audio" loop preload="auto">
        <source src="../Joy.mp3" type="audio/mpeg">
    </audio>

    <div id="google-view">
        <h1 style="color: var(--pi-gold);">Learning Joy AI 🌙</h1>
        <p style="margin-bottom: 30px;">مرحباً بك في واجهة العرض الخارجية</p>
        <button onclick="enterPi()" class="direct-btn">دخول التطبيق الرسمي 🚀</button>
        <p style="margin-top: 20px; font-size: 0.8rem; color: #666;">سيتم إيقاف الموسيقى عند الدخول للبيئة الآمنة</p>
    </div>

    <div id="pi-app-view">
        <div class="card">
            <h2 style="color: var(--pi-gold);">بيئة BM الموثقة 🛡️</h2>
            <p id="user-display">جاري التحقق من الهوية...</p>
            <div style="background: rgba(229, 169, 61, 0.1); padding: 15px; border-radius: 15px; margin-top: 20px; color: var(--pi-gold);">
                بونص الـ 3 أضعاف نشط في البيئة الرسمية
            </div>
        </div>
    </div>

    <script>
        const audio = document.getElementById('joy-audio');
        const googleView = document.getElementById('google-view');
        const piView = document.getElementById('pi-app-view');

        // وظيفة فحص البيئة (جوجل ولا باي؟)
        window.onload = function() {
            const isPiBrowser = window.location.href.includes("pinet.com") || window.location.href.includes("pi");
            
            if (isPiBrowser) {
                // لو جوه باي: أظهر التطبيق، وقف الموسيقى، وابدأ التوثيق
                piView.style.display = 'block';
                audio.pause();
                initPiSDK();
            } else {
                // لو بره (جوجل): أظهر واجهة الترحيب وشغل الموسيقى
                googleView.style.display = 'flex';
                // الموسيقى تشتغل بضغطة المستخدم الأولى للالتزام بقوانين جوجل
                document.body.addEventListener('click', () => audio.play(), { once: true });
            }
        };

        function enterPi() {
            // التحويل للرابط الرسمي داخل متصفح باي
            window.location.href = "pi://aibcbecb7115.pinet.com";
        }

        function initPiSDK() {
            if (window.Pi) {
                window.Pi.init({ version: "2.0", sandbox: false });
                window.Pi.authenticate(['username'], (p) => {}).then(auth => {
                    document.getElementById('user-display').innerText = "أهلاً بك يا رائد: " + auth.user.username;
                });
            }
        }
    </script>
</body>
</html>
