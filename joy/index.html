<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Joy with AI - Official BM System</title>
    
    <script src="../BM-Core/bm-core-engine.js"></script>
    <script src="bm-integration.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --pi-purple: #541d72; --ramadan-red: #8e0e14; --gold: #ffd700; --soft-bg: #fdfbfb; }
        body { font-family: 'Cairo', sans-serif; background: var(--soft-bg); margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow-x: hidden; }
        
        /* شاشة الترحيب الإمبراطورية */
        #welcome-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, var(--ramadan-red), var(--pi-purple)); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; transition: 0.8s; color: white; text-align: center; }
        .play-btn { background: var(--gold); color: #8e0e14; border: none; padding: 18px 50px; border-radius: 50px; font-size: 1.6rem; font-weight: bold; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.3); transition: 0.3s; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* البطاقة الرئيسية */
        #main-content { display: none; opacity: 0; transition: opacity 1s; width: 100%; flex-direction: column; align-items: center; }
        .main-card { width: 90%; max-width: 420px; background: white; border-radius: 40px; box-shadow: 0 25px 50px rgba(0,0,0,0.1); overflow: hidden; text-align: center; border: 1px solid rgba(0,0,0,0.05); }
        .hero-area { background: var(--pi-purple); color: white; padding: 45px 20px; border-bottom-left-radius: 70px; border-bottom-right-radius: 70px; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 25px; }
        .stat-box { background: #f8f4ff; padding: 15px; border-radius: 20px; border: 1px solid #e9dcfc; }
        .stat-val { display: block; font-size: 1.2rem; font-weight: bold; color: var(--pi-purple); }

        .btn-enter { display: block; width: 85%; margin: 20px auto; background: linear-gradient(45deg, #bc13fe, #7a01bb); color: white; text-decoration: none; padding: 20px; border-radius: 45px; font-size: 1.3rem; font-weight: bold; box-shadow: 0 8px 20px rgba(122, 1, 187, 0.3); }
        .legacy-badge { background: #fff9e6; color: #b8860b; padding: 10px; font-size: 0.8rem; font-weight: bold; border-top: 1px solid #eee; }
    </style>
</head>
<body>

    <div id="welcome-overlay">
        <h1 style="font-size: 2.5rem; margin-bottom: 10px;">Learning Joy AI 🌙</h1>
        <p style="font-size: 1rem; margin-bottom: 30px; opacity: 0.9;">نظام BM - إرث الـ 94 عاماً وشهرين</p>
        <button class="play-btn" onclick="startApp()">دخول الإمبراطورية ▶️</button>
    </div>

    <div id="main-content">
        <div class="main-card">
            <div class="hero-area">
                <h2 style="margin:0;">منظومة BM الذكية</h2>
                <p style="opacity: 0.85; font-size: 0.8rem;" id="legacy-text">جاري تحميل بيانات الإرث...</p>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-val" id="bm-balance">3.14 BM</span> 
                    <small style="color: #666;">بونص البداية</small>
                </div>
                <div class="stat-box">
                    <span class="stat-val">3 أضعاف</span>
                    <small style="color: #666;">مضاعفة الاشتراك</small>
                </div>
            </div>

            <a href="https://habib2000000.github.io/" class="btn-enter">استكشاف الإمبراطورية 🚀</a>

            <div class="legacy-badge" id="timer-display">
                ⏳ متبقي 1130 شهر من العطاء المستمر
            </div>
            
            <div style="font-size: 0.7rem; color: #999; padding: 15px;">
                المطور: <b>habib2000000</b> | مدعوم بـ 3.14 تريليون توكن
            </div>
        </div>
    </div>

    <script>
        function startApp() {
            document.getElementById("welcome-overlay").style.opacity = "0";
            setTimeout(() => {
                document.getElementById("welcome-overlay").style.display = "none";
                const main = document.getElementById("main-content");
                main.style.display = "flex";
                setTimeout(() => {
                    main.style.opacity = "1";
                    loadCoreData();
                }, 50);
            }, 800);
        }

        function loadCoreData() {
            if (window.BM_CORE) {
                document.getElementById('legacy-text').innerText = "نظام التريليونات نشط 🟢";
                document.getElementById('timer-display').innerText = `⏳ إرث أبدي: متبقي ${window.BM_CORE.LOGIC.LIFESPAN_MONTHS} شهر`;
            }
        }
    </script>
</body>
</html>
