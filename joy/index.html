<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة BM الذكية</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --pi-purple: #541d72; --gold: #ffd700; --ramadan-red: #8e0e14; }
        body { font-family: 'Cairo', sans-serif; background: #fdfbfb; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        #welcome-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, var(--ramadan-red), var(--pi-purple)); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; color: white; text-align: center; }
        .official-link-btn { background: var(--gold); color: #8e0e14; border: none; padding: 22px 40px; border-radius: 50px; font-size: 1.2rem; font-weight: bold; cursor: pointer; box-shadow: 0 15px 30px rgba(0,0,0,0.4); animation: pulse 2s infinite; }
        #main-content { display: none; width: 95%; max-width: 420px; text-align: center; }
        .main-card { background: white; border-radius: 40px; box-shadow: 0 25px 50px rgba(0,0,0,0.15); overflow: hidden; border: 1px solid #eee; }
        .hero-area { background: var(--pi-purple); color: white; padding: 40px 20px; border-bottom-left-radius: 60px; border-bottom-right-radius: 60px; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <audio id="success-audio" loop preload="auto" playsinline>
        <source src="Hamada Helal - El Nagah Ahla Hedeya(Official Video) _ حماده هلال - النجاح أحلي هدية - الكليب الرسمي _ (MP3_160K).mp3" type="audio/mpeg">
    </audio>

    <div id="welcome-overlay">
        <h1 style="font-size: 2rem; margin-bottom: 25px;">Learning Joy AI 🌙</h1>
        <button class="official-link-btn" id="start-btn">
            دخول المنظومة وتشغيل النجاح 🎶
            <span style="display:block; font-size:0.8rem; opacity:0.8;">aibcbecb7115.pinet.com</span>
        </button>
        <p id="device-msg" style="margin-top: 20px; font-size: 0.85rem; opacity: 0.9;">فحص أمان الجهاز...</p>
    </div>

    <div id="main-content">
        <div class="main-card">
            <div class="hero-area">
                <h2 style="margin:0;">منظومة BM الذكية</h2>
                <div style="background: rgba(255,255,255,0.1); padding: 8px; border-radius: 20px; margin-top: 10px; font-size: 0.8rem;">🛡️ وضع الخصوصية نشط</div>
            </div>
            <div style="padding: 20px;">
                <h3 style="color: var(--ramadan-red);">🎉 النجاح أحلى هدية</h3>
                <p>تم التفعيل بنجاح على الموبايل</p>
            </div>
        </div>
    </div>

    <script>
        const audio = document.getElementById('success-audio');
        const startBtn = document.getElementById('start-btn');

        // 1. كود كشف الجهاز (منع الكمبيوتر)
        window.onload = function() {
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            if (!isMobile) {
                document.getElementById('device-msg').innerHTML = "<b style='color:var(--gold)'>⚠️ عذراً: المنظومة للموبايل فقط.</b>";
                startBtn.style.display = "none";
            } else {
                document.getElementById('device-msg').innerText = "جهاز موبايل آمن ✅";
            }
        };

        // 2. السر الحقيقي لتشغيل الصوت في الموبايل (User Interaction)
        startBtn.addEventListener('click', function() {
            // محاولة التشغيل بأكثر من طريقة لضمان النجاح في Pi Browser
            audio.play(); 
            
            // إخفاء الشاشة
            document.getElementById("welcome-overlay").style.display = "none";
            document.getElementById("main-content").style.display = "block";
            setTimeout(() => document.getElementById("main-content").style.opacity = "1", 50);

            // تفعيل Pi SDK
            if (window.Pi) {
                Pi.init({ version: "2.0", sandbox: false });
                Pi.authenticate(['username'], () => {}).catch(() => {});
            }
        });
    </script>
</body>
</html>
