<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Joy with AI - Official BM System</title>
    
    <script src="../BM-Core/bm-core-engine.js"></script>
    <script src="bm-integration.js"></script>

    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --pi-purple: #541d72; 
            --ramadan-red: #8e0e14; 
            --gold: #ffd700; 
            --soft-bg: #fdfbfb; 
        }
        body { 
            font-family: 'Cairo', sans-serif; 
            background: var(--soft-bg); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            overflow-x: hidden; 
        }
        
        /* شاشة الترحيب الإمبراطورية */
        #welcome-overlay { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: linear-gradient(135deg, var(--ramadan-red), var(--pi-purple)); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            z-index: 2000; 
            transition: 0.8s; 
            color: white; 
            text-align: center; 
        }
        .play-btn { 
            background: var(--gold); 
            color: #8e0e14; 
            border: none; 
            padding: 18px 50px; 
            border-radius: 50px; 
            font-size: 1.6rem; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            transition: 0.3s; 
            animation: pulse 2s infinite; 
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* البطاقة الرئيسية */
        #main-content { 
            display: none; 
            opacity: 0; 
            transition: opacity 1s; 
            width: 100%; 
            flex-direction: column; 
            align-items: center; 
        }
        .main-card { 
            width: 90%; 
            max-width: 420px; 
            background: white; 
            border-radius: 40px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.1); 
            overflow: hidden; 
            text-align: center; 
            border: 1px solid rgba(0,0,0,0.05); 
        }
        .hero-area { 
            background: var(--pi-purple); 
            color: white; 
            padding: 45px 20px; 
            border-bottom-left-radius: 70px; 
            border-bottom-right-radius: 70px; 
        }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 25px; }
        .stat-box { background: #f8f4ff; padding: 15px; border-radius: 20px; border: 1px solid #e9dcfc; }
        .stat-val { display: block; font-size: 1.4rem; font-weight: bold; color: var(--pi-purple); }

        .btn-enter { 
            display: block; 
            width: 85%; 
            margin: 20px auto; 
            background: linear-gradient(45deg, #bc13fe, #7a01bb); 
            color: white; 
            text-decoration: none; 
            padding: 20px; 
            border-radius: 45px; 
            font-size: 1.3rem; 
            font-weight: bold; 
            box-shadow: 0 8px 20px rgba(122, 1, 187, 0.3); 
        }
        .legacy-badge { 
            background: #fff9e6; 
            color: #b8860b; 
            padding: 12px; 
            font-size: 0.85rem; 
            font-weight: bold; 
            border-top: 1px solid #eee; 
        }
        .legal-notice { font-size: 0.75rem; color: #999; padding: 15px; line-height: 1.5; background: #fafafa; }
    </style>
</head>
<body>

    <div id="welcome-overlay">
        <h1 style="font-size: 2.8rem; margin-bottom: 15px;">Learning Joy AI 🌙</h1>
        <p style="font-size: 1.1rem; margin-bottom: 35px; opacity: 0.9;">إرث إمبراطورية BM - 94.2 عاماً</p>
        <button class="play-btn" onclick="startApp()">دخول النظام ▶️</button>
    </div>

    <div id="main-content">
        <div class="main-card">
            <div class="hero-area">
                <h2 style="margin:0;">مرحباً بك في الإمبراطورية</h2>
                <p id="core-status" style="opacity: 0.85; font-size: 0.9rem;">جاري فحص اتصال BM-Core...</p>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-val" id="user-reward">3.14 BM</span> 
                    <small style="color: #666;">بونص الترحيب</small>
                </div>
                <div class="stat-box">
                    <span class="stat-val" id="multiplier-val">×3</span>
                    <small style="color: #666;">مضاعفة الاشتراك</small>
                </div>
            </div>

            <a href="https://aibcbecb7115.pinet.com/" class="btn-enter">دخول التطبيق الآن 🚀</a>

            <div class="legacy-badge" id="legacy-timer">
                ⏳ متبقي 1130 شهر من العطاء المستمر
            </div>

            <div class="legal-notice">
                المطور: <b>habib2000000</b><br>
                نظام BM المدعوم بـ 3.14 تريليون توكن.<br>
                السيولة مؤمنة بـ 300 Pi لكل دورة توسع.
            </div>
        </div>
    </div>

    <audio id="bgMusic" loop><source src="welcome.mp3" type="audio/mpeg"></audio>

    <script>
        function startApp() {
            const audio = document.getElementById("bgMusic");
            audio.play().catch(e => console.log("الصوت بانتظار التفاعل"));
            
            document.getElementById("welcome-overlay").style.opacity = "0";
            setTimeout(() => {
                document.getElementById("welcome-overlay").style.display = "none";
                const main = document.getElementById("main-content");
                main.style.display = "flex";
                setTimeout(() => {
                    main.style.opacity = "1";
                    syncWithCore();
                }, 50);
            }, 800);
        }

        function syncWithCore() {
            if (window.BM_CORE) {
                document.getElementById('core-status').innerText = "نظام BM متصل (3.14 تريليون) 🟢";
                document.getElementById('user-reward').innerText = window.BM_CORE.GOVERNANCE_RULES.WELCOME_BONUS + " BM";
                document.getElementById('multiplier-val').innerText = "×" + window.BM_CORE.GOVERNANCE_RULES.SUBSCRIPTION_MULTIPLIER;
                document.getElementById('legacy-timer').innerText = `⏳ إرث أبدي: متبقي ${window.BM_CORE.LEGACY_SYSTEM.TOTAL_MONTHS} شهر`;
            } else {
                document.getElementById('core-status').innerText = "فشل الاتصال بـ BM-Core 🔴";
            }
        }
    </script>
</body>
</html>
