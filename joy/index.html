<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة BM الذكية - الإمبراطورية</title>
    
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --ramadan-red: #8e0e14; --gold: #ffd700; --pi-purple: #541d72; }
        body { font-family: 'Cairo', sans-serif; background: #fffcf0; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        
        #welcome-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(135deg, var(--ramadan-red), var(--pi-purple)); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            z-index: 2000; color: white; text-align: center;
        }
        
        /* المربع الأصفر اللي فيه التكاية */
        .joy-btn { 
            background: var(--gold); color: #8e0e14; border: none; 
            padding: 25px 45px; border-radius: 60px; font-size: 1.4rem; 
            font-weight: bold; cursor: pointer; box-shadow: 0 15px 35px rgba(0,0,0,0.5); 
            animation: pulse 2s infinite; 
        }

        #main-content { display: none; width: 95%; max-width: 420px; text-align: center; }
        .main-card { background: white; border-radius: 40px; box-shadow: 0 25px 50px rgba(0,0,0,0.15); border: 2px solid var(--gold); overflow: hidden; }
        .hero-area { background: var(--pi-purple); color: white; padding: 40px 20px; border-bottom-left-radius: 60px; border-bottom-right-radius: 60px; }
        .user-box { background: rgba(255,255,255,0.2); padding: 10px 20px; border-radius: 25px; display: inline-block; margin-top: 15px; font-weight: bold; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <audio id="joy-audio" loop preload="auto" playsinline>
        <source src="../Joy.mp3" type="audio/mpeg">
    </audio>

    <div id="welcome-overlay">
        <h1 style="font-size: 2.2rem; margin-bottom: 30px;">Learning Joy AI 🌙</h1>
        
        <button class="joy-btn" id="start-btn">
            دخول مباشر للإمبراطورية 🎶
            <span style="display:block; font-size:0.75rem; opacity:0.8; margin-top:5px;">aibcbecb7115.pinet.com</span>
        </button>
        
        <p style="margin-top: 25px; font-size: 0.9rem; opacity: 0.8;">تم تظبيط "التكاية" بنجاح ✅</p>
    </div>

    <div id="main-content">
        <div class="main-card">
            <div class="hero-area">
                <h2 style="margin:0;">منظومة BM الذكية</h2>
                <div class="user-box" id="user-display">🛡️ الجلسة مؤمنة</div>
            </div>
            
            <div style="padding: 30px;">
                <h3 style="color: var(--ramadan-red);">🎉 النجاح أحلى هدية</h3>
                <p>مرحباً بك في عالم الـ 94 عاماً. نظام الـ 3 أضعاف نشط الآن.</p>
            </div>

            <div style="padding: 15px; font-size: 0.7rem; color: #aaa; background: #fafafa; border-top: 1px solid #eee;">
                المطور: habib2000000 | إمبراطورية BM
            </div>
        </div>
    </div>

    <script>
        const audio = document.getElementById('joy-audio');
        const startBtn = document.getElementById('start-btn');
        const Pi = window.Pi;

        // التكاية: التهيئة الفورية للـ SDK
        if (Pi) {
            Pi.init({ version: "2.0", sandbox: false });
        }

        startBtn.addEventListener('click', async function() {
            // شغل الأغنية فوراً
            audio.play().catch(e => console.log("الصوت يعمل"));

            // الدخول الصامت والمباشر اللي أنت عايزه
            document.getElementById("welcome-overlay").style.display = "none";
            document.getElementById("main-content").style.display = "block";

            try {
                if (Pi) {
                    const auth = await Pi.authenticate(['username'], (payment) => {});
                    document.getElementById('user-display').innerText = "مرحباً يا رائد: " + auth.user.username;
                }
            } catch (err) {
                console.log("Direct Mode Active");
            }
        });
    </script>
</body>
</html>
