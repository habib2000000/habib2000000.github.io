<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة BM الذكية - الدخول المباشر</title>
    
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --ramadan-red: #8e0e14; --gold: #ffd700; --pi-purple: #541d72; }
        body { font-family: 'Cairo', sans-serif; background: #fffcf0; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        
        /* شاشة الترحيب الذكية */
        #welcome-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(135deg, var(--ramadan-red), var(--pi-purple)); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            z-index: 2000; color: white; text-align: center; transition: 0.5s;
        }
        
        /* الزر الأصفر "التكاية" */
        .joy-btn { 
            background: var(--gold); color: #8e0e14; border: none; 
            padding: 25px 50px; border-radius: 60px; font-size: 1.4rem; 
            font-weight: bold; cursor: pointer; box-shadow: 0 15px 35px rgba(0,0,0,0.4); 
            transition: 0.3s; animation: pulse 2s infinite; 
        }

        #main-content { display: none; width: 95%; max-width: 420px; text-align: center; opacity: 0; transition: 1s; }
        .main-card { background: white; border-radius: 40px; box-shadow: 0 25px 50px rgba(0,0,0,0.15); overflow: hidden; border: 2px solid var(--gold); }
        .hero-area { background: var(--pi-purple); color: white; padding: 40px 20px; border-bottom-left-radius: 60px; border-bottom-right-radius: 60px; }
        .user-badge { background: rgba(255,255,255,0.2); padding: 10px 20px; border-radius: 25px; display: inline-block; margin-top: 15px; font-weight: bold; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <audio id="joy-audio" loop preload="auto" playsinline>
        <source src="../Joy.mp3" type="audio/mpeg">
    </audio>

    <div id="welcome-overlay">
        <div style="font-size: 3rem; margin-bottom: 10px;">🛡️</div>
        <h1 style="margin-bottom: 30px;">Learning Joy AI</h1>
        
        <button class="joy-btn" id="start-btn">
            دخول مباشر للمنظومة 🎶
            <span style="display:block; font-size:0.75rem; opacity:0.8; margin-top:5px;">aibcbecb7115.pinet.com</span>
        </button>
        
        <p id="loading-msg" style="margin-top: 25px; font-size: 0.9rem; opacity: 0.8;">المنظومة جاهزة للإنطلاق</p>
    </div>

    <div id="main-content">
        <div class="main-card">
            <div class="hero-area">
                <h2 style="margin:0;">إمبراطورية BM</h2>
                <div class="user-badge" id="user-display">جاري التحقق...</div>
            </div>
            
            <div style="padding: 30px;">
                <h3 style="color: var(--ramadan-red); margin-bottom: 15px;">🎉 النجاح أحلى هدية</h3>
                <p style="color: #555;">أهلاً بك في المنظومة الذكية. بونص الـ 3 أضعاف نشط الآن بخصوصية كاملة.</p>
                <div style="background: #fff9e6; border: 1px dashed var(--gold); padding: 15px; border-radius: 15px; margin-top: 20px;">
                    💰 رصيد BM Tokens: متصل
                </div>
            </div>

            <div style="padding: 15px; font-size: 0.7rem; color: #aaa; background: #fafafa; border-top: 1px solid #eee;">
                المطور: habib2000000 | إرث الـ 94 عاماً
            </div>
        </div>
    </div>

    <script>
        const audio = document.getElementById('joy-audio');
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('welcome-overlay');
        const mainContent = document.getElementById('main-content');

        // تهيئة الـ SDK فوراً
        if (window.Pi) {
            window.Pi.init({ version: "2.0", sandbox: false });
        }

        startBtn.addEventListener('click', async function() {
            // التكاية 1: تشغيل الصوت فوراً
            audio.play().catch(() => console.log("Audio needs user interaction"));

            // التكاية 2: الدخول الصامت والمباشر
            try {
                // إخفاء الشاشة فوراً لتعطي شعور بالسرعة
                overlay.style.opacity = '0';
                setTimeout(() => {
                    overlay.style.display = 'none';
                    mainContent.style.display = 'block';
                    setTimeout(() => mainContent.style.opacity = '1', 50);
                }, 500);

                // التحقق من الهوية في الخلفية بدون تعطيل المستخدم
                if (window.Pi) {
                    const auth = await window.Pi.authenticate(['username'], (payment) => {});
                    document.getElementById('user-display').innerText = "الرائد: " + auth.user.username;
                }
            } catch (err) {
                document.getElementById('user-display').innerText = "وضع المعاينة النشط 🛡️";
            }
        });
    </script>
</body>
</html>
